name: Bug report
description: Something is wrong or crashes
title: "bug: "
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you got.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: A small `.pel` file or the exact steps, and the command you ran.
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `pelago --version`, or the commit or extension version.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system and CPU
      placeholder: Windows 11 x86-64, Ubuntu 24.04 aarch64, ...
  - type: textarea
    id: extra
    attributes:
      label: Anything else
