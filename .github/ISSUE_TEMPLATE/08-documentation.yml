name: Documentation
description: Docs, the syntax tour, or an example that is wrong, missing, or unclear
title: "docs: "
body:
  - type: checkboxes
    id: preflight
    attributes:
      label: Before you submit
      options:
        - label: I searched open and closed issues
          required: true
  - type: input
    id: where
    attributes:
      label: Location
      description: A link or a path, for example `docs/design/types.md`, `examples/tour.pel`, or a page on the website.
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Problem
      options:
        - Wrong or out of date
        - Missing
        - Unclear or confusing
        - Example does not compile or run
        - Typo or broken link
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: What you read, what you expected, and what would fix it. For a failing example include the command, the error and `pelago --version`.
    validations:
      required: true
